name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Type-check edge functions
        run: deno check --config supabase/functions/signing/deno.json supabase/functions/*/index.ts
